name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install repository-local test browser
        working-directory: web
        run: npm run test:e2e:install

      - name: Validate code, data, build, and performance
        env:
          # Shared ubuntu-latest runners are materially slower than the local
          # product benchmark. These remain regression tripwires, not UX budgets.
          LINEAGE_BENCH_DEFAULT_LIMIT_MS: "9000"
          LINEAGE_BENCH_INSTITUTIONS_LIMIT_MS: "11000"
        run: ./scripts/validate.sh

      - name: Validate core browser journeys
        working-directory: web
        run: npm run test:e2e
