name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install repository-local test browser
        working-directory: web
        run: npm run test:e2e:install

      - name: Validate code, data, build, and performance
        env:
          # Shared ubuntu-latest runners are materially slower than the local
          # product benchmark. These remain regression tripwires, not UX budgets.
          LINEAGE_BENCH_DEFAULT_LIMIT_MS: "9000"
          LINEAGE_BENCH_INSTITUTIONS_LIMIT_MS: "11000"
        run: ./scripts/validate.sh

      - name: Validate core browser journeys
        working-directory: web
        run: npm run test:e2e
